[profile.release]
# Maximum optimization level for speed
opt-level = 3

# Full Link Time Optimization (LTO) across all crates
lto = "fat"

# Single codegen unit allows for more global optimizations
codegen-units = 1

# hmm... do I want this?
overflow-checks = true


[workspace]
resolver = "3"
members = ["workspace_crates/*"]

[workspace.dependencies]

# internal workspace crates

config_reader = { path = "workspace_crates/config_reader" } 
server = { path = "workspace_crates/server" }
http_stuff = { path = "workspace_crates/http_stuff" }
encoding = { path = "workspace_crates/encoding" }
url = { path = "workspace_crates/url" } 
error_structs = { path = "workspace_crates/error_structs" }

# third-party external crates
# for injecting stylesheet links
lol_html = "2.8.1"

chrono = "0.4.44"

unicode-segmentation = "1.13.2"
git-version = "0.3.9"

dotenvy = "0.15.7"
config = "0.15.22"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2.5"

regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
humantime-serde = "1.1.1"

indexmap = "2.14.0"
sqlx = { version = "0.8.6", features = ["migrate", "postgres", "macros", "runtime-tokio", "time", "tls-rustls-aws-lc-rs"] }

tokio = { version = "1.51.1", features = ["full", "tracing"] }


askama = { version = "0.15.6", features = ["std", "derive"] }

argon2 = {version = "0.5.3", features = ["zeroize"] }


rand = "0.10.1"
hex = "0.4.3"
uuid = { version = "1.23.0", features = ["v4"] }
urlencoding = "2.1.3"
percent-encoding = "2.3.2"




